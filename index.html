<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PROJECT_PANGUIN_30 // 熊熊與企鵝的秘密檔案</title>
<style>
:root {
  --bg-dark: #03040a;
  --panel: rgba(10, 15, 30, 0.88);
  --line: #00f3ff;
  --pink: #ff007f;
  --purple: #9d00ff;
  --gold: #ffe66d;
  --text: #e0f7fc;
  --muted: #52798e;
  --ok: #00ff9d;
  --bad: #ff3366;
}

*, *:before, *:after { 
  box-sizing: border-box !important; 
  -webkit-tap-highlight-color: transparent; 
}

html, body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 50% 15%, rgba(157, 0, 255, 0.2) 0%, transparent 60%),
    radial-gradient(circle at 50% 85%, rgba(255, 0, 127, 0.18) 0%, transparent 70%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Consolas, "Noto Sans TC", monospace;
  color: var(--text); overflow-x: hidden; position: relative;
}

/* 1. Synthwave 透視網格背景動畫 */
.grid-bg {
  position: fixed; bottom: 0; left: 0; width: 100%; height: 45vh;
  perspective: 450px; overflow: hidden; pointer-events: none; z-index: 1;
  mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
}
.grid-plane {
  position: absolute; inset: 0; width: 200%; height: 200%; left: -50%;
  background-image: 
    linear-gradient(to right, rgba(0, 243, 255, 0.25) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 0, 127, 0.25) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: rotateX(75deg);
  animation: gridMove 4s linear infinite;
}
@keyframes gridMove {
  0% { transform: rotateX(75deg) translateY(0); }
  100% { transform: rotateX(75deg) translateY(40px); }
}

/* Scanlines 掃描線 */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.12;
  background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0, 243, 255, 0.3) 3px);
  mix-blend-mode: screen; z-index: 20;
}

.wrap { 
  width: 100%; max-width: 600px; margin: 0 auto; padding: 12px 12px 30px 12px;
  position: relative; z-index: 10;
}

.header {
  width: 100%; border: 1px solid rgba(0, 243, 255, 0.3); background: rgba(6, 13, 23, 0.85);
  backdrop-filter: blur(8px); padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted);
  border-radius: 8px; margin-bottom: 12px;
  box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
}
.brand { color: var(--line); font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 8px var(--line); }
.status { color: var(--ok); font-weight: bold; text-shadow: 0 0 8px var(--ok); }

.screen {
  width: 100%; border: 1px solid rgba(255, 0, 127, 0.4); background: var(--panel);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(255, 0, 127, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
  padding: 20px; min-height: 75vh; border-radius: 12px; position: relative;
  display: flex; flex-direction: column; justify-content: space-between;
}

/* CSS 繪製 Synthwave 太陽圖元 */
.synthwave-sun {
  width: 80px; height: 80px; margin: 10px auto 15px auto; border-radius: 50%;
  background: linear-gradient(to bottom, #ffe66d 0%, #ff007f 60%, #9d00ff 100%);
  box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), 0 0 40px rgba(255, 230, 109, 0.4);
  position: relative; overflow: hidden;
}
.synthwave-sun::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, transparent 0px, transparent 4px, rgba(10, 15, 30, 0.9) 5px, rgba(10, 15, 30, 0.9) 7px);
}

/* 幾何頭像徽章 */
.avatar-badge {
  display: flex; justify-content: center; gap: 20px; margin: 10px 0;
}
.avatar-icon {
  width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 12px var(--line);
}
.avatar-icon.bear {
  border-color: var(--pink); background: rgba(255, 0, 127, 0.1); box-shadow: 0 0 12px var(--pink);
}

h1 { 
  font-size: clamp(22px, 6vw, 32px); letter-spacing: 1px; margin: 8px 0; 
  color: #fff; text-shadow: 0 0 10px var(--line), 0 0 20px var(--purple); 
  word-break: break-word; text-align: center;
}
h2 { color: var(--line); letter-spacing: 1px; margin-top: 0; font-size: 18px; text-shadow: 0 0 8px rgba(0, 243, 255, 0.5); }
.kicker { color: var(--pink); font-size: 11px; letter-spacing: 1px; font-weight: bold; text-shadow: 0 0 6px var(--pink); text-align: center; }

.info-box { 
  width: 100%; font-size: 12.5px; line-height: 1.6; color: #8ec3cf; 
  background: rgba(0, 0, 0, 0.6); padding: 14px; border: 1px dashed rgba(0, 243, 255, 0.4); 
  border-radius: 8px; margin: 12px 0; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}
.info-box div { word-break: break-all; }

p { line-height: 1.6; margin: 10px 0; font-size: 14px; }
.muted { color: var(--muted); font-size: 12px; }

/* 霓虹按鈕美化 */
.btn {
  font: inherit; font-size: 14px; font-weight: bold; color: var(--text); 
  background: linear-gradient(135deg, rgba(8, 23, 38, 0.9), rgba(15, 44, 66, 0.9)); 
  border: 1px solid var(--line);
  padding: 13px 16px; cursor: pointer; margin: 8px 0; transition: all 0.25s ease; 
  display: block; width: 100%; text-align: center; border-radius: 8px; -webkit-appearance: none;
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
}
.btn:active { 
  background: var(--line); color: #000; 
  box-shadow: 0 0 20px var(--line); transform: scale(0.98); 
}
.btn.pink { 
  border-color: var(--pink); color: #fff; 
  background: linear-gradient(135deg, rgba(255, 42, 141, 0.15), rgba(157, 0, 255, 0.2)); 
  box-shadow: 0 0 12px rgba(255, 0, 127, 0.2);
}
.btn.pink:active { 
  background: var(--pink); color: #fff; 
  box-shadow: 0 0 25px var(--pink); 
}
.btn.ok { 
  border-color: var(--ok); color: var(--ok); 
  background: rgba(0, 255, 157, 0.08); 
  box-shadow: 0 0 12px rgba(0, 255, 157, 0.15);
}
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.options { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; width: 100%; }
.option { 
  text-align: left; width: 100%; margin: 0; border-color: rgba(0, 243, 255, 0.25); 
  font-size: 13.5px; line-height: 1.4; padding: 12px; 
  background: rgba(10, 20, 35, 0.7); 
}

.input { 
  width: 100%; background: rgba(2, 6, 12, 0.8); border: 1px solid rgba(0, 243, 255, 0.4); 
  color: var(--text); padding: 13px; font-size: 14px; outline: none; border-radius: 8px; 
  transition: all 0.3s ease; -webkit-appearance: none; 
}
.input:focus { border-color: var(--pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }

.feedback { 
  margin-top: 12px; padding: 12px; border-left: 4px solid var(--line); 
  background: rgba(8, 26, 38, 0.9); animation: fadeIn 0.3s; 
  font-size: 13px; line-height: 1.5; width: 100%; border-radius: 0 8px 8px 0; 
}
.feedback.bad { border-color: var(--bad); color: #ffb3c1; background: rgba(26, 8, 13, 0.9); box-shadow: 0 0 10px rgba(255, 51, 102, 0.2); }
.feedback.good { border-color: var(--ok); color: #c0ffd5; background: rgba(8, 26, 18, 0.9); box-shadow: 0 0 10px rgba(0, 255, 157, 0.2); }

.terminal { 
  background: rgba(2, 5, 11, 0.9); border: 1px solid rgba(0, 243, 255, 0.3); 
  padding: 14px; color: #8ee2ee; font-size: 12px; margin: 10px 0; border-radius: 8px; width: 100%; 
}

.glitch { animation: glitch 1.5s infinite steps(2, end); }
@keyframes glitch { 
  0%,100%{transform:none} 
  20%{transform:translate(2px,-1px)} 
  40%{transform:translate(-2px,1px)} 
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.chat-box { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; width: 100%; }
.chat-msg { padding: 10px 14px; border-radius: 10px; max-width: 90%; line-height: 1.4; font-size: 13px; }
.chat-left { background: rgba(14, 34, 51, 0.9); align-self: flex-start; border: 1px solid rgba(0, 243, 255, 0.3); color: #a5e3f0; }
.chat-right { background: rgba(43, 14, 32, 0.9); align-self: flex-end; border: 1px solid rgba(255, 0, 127, 0.3); color: #f0a5ce; }

.heart-rate { 
  display: flex; align-items: center; justify-content: center; gap: 16px; 
  margin: 15px 0; background: rgba(4, 10, 20, 0.8); padding: 16px; 
  border: 1px solid rgba(255, 0, 127, 0.4); border-radius: 8px; width: 100%; 
  box-shadow: 0 0 15px rgba(255, 0, 127, 0.15);
}
.heart-icon { font-size: 38px; color: var(--pink); animation: pulse 0.8s infinite alternate; text-shadow: 0 0 15px var(--pink); }
@keyframes pulse { from{transform:scale(1)} to{transform:scale(1.25)} }

.timeline-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; width: 100%; }
.timeline-item { 
  background: rgba(8, 26, 38, 0.8); border: 1px dashed rgba(0, 243, 255, 0.4); 
  padding: 10px 12px; font-size: 12px; border-radius: 6px; width: 100%; 
  display: flex; justify-content: space-between; align-items: center; 
}
.timeline-item .remove-btn { color: var(--bad); cursor: pointer; font-weight: bold; padding: 0 4px; }

.btn-group { display: flex; gap: 8px; margin-top: 10px; width: 100%; }
.btn-group .btn { flex: 1; margin: 0; }

.letter-box { 
  line-height: 1.8; text-align: left; margin: 14px 0; 
  background: linear-gradient(135deg, rgba(255, 0, 127, 0.08), rgba(157, 0, 255, 0.08)); 
  padding: 18px; border: 1px solid rgba(255, 0, 127, 0.4); border-radius: 8px; 
  font-size: 14px; box-shadow: 0 0 20px rgba(255, 0, 127, 0.1);
}
.letter-highlight { color: var(--gold); background: rgba(255, 230, 109, 0.12); padding: 2px 6px; border-radius: 4px; font-weight: bold; text-shadow: 0 0 5px rgba(255, 230, 109, 0.5); }

/* 生日證書徽章 */
.cert-badge {
  margin: 15px auto; padding: 10px 20px; border: 2px double var(--gold);
  border-radius: 30px; display: inline-flex; align-items: center; gap: 8px;
  color: var(--gold); background: rgba(255, 230, 109, 0.08); font-weight: bold; font-size: 13px;
  box-shadow: 0 0 15px rgba(255, 230, 109, 0.2);
}
</style>
</head>
<body>

<!-- 賽博朋克透視網格動畫背景 -->
<div class="grid-bg"><div class="grid-plane"></div></div>

<div class="wrap">
  <div class="header">
    <span class="brand">PROJECT_PANGUIN // V2026</span>
    <span class="status" id="status">SYSTEM READY</span>
  </div>
  <main class="screen" id="app"></main>
</div>

<script>
var app, statusEl, clickCount = 0;

function setStatus(text, color) {
  if (statusEl) {
    statusEl.textContent = text;
    statusEl.style.color = color || 'var(--ok)';
  }
}

function render(html) { 
  if (app) {
    app.style.animation = 'none';
    app.offsetHeight;
    app.style.animation = 'fadeIn 0.3s ease-out';
    app.innerHTML = html; 
  }
  window.scrollTo(0, 0);
}

// --- START PAGE ---
function start() {
  setStatus("ONLINE", "var(--ok)");
  render(
    '<div>' +
      '<div class="synthwave-sun"></div>' +
      '<div class="kicker">ENCRYPTED TRANSMISSION // 2026 SPECIAL</div>' +
      '<h1 class="glitch">PANGUIN30_PROTOCOL</h1>' +
      '<div class="avatar-badge">' +
        '<div class="avatar-icon">🐧</div>' +
        '<div class="avatar-icon bear">🐻</div>' +
      '</div>' +
      '<div class="info-box">' +
        '<div>TARGET: 熊熊的未婚夫</div>' +
        '<div>SENDER: 企鵝的未婚妻</div>' +
        '<div>SECURITY CLEARANCE: LEVEL 5</div>' +
        '<div>OBJECTIVE: UNLOCK THE 30TH CORE</div>' +
      '</div>' +
      '<p style="text-align:center;">偵測到來自「企鵝的未婚妻」的加密封包。這是一份專屬於你哋雙方嘅系統測試驗證。</p>' +
      '<p class="muted" style="text-align:center;">備註：請確保附近有熊熊陪同，或準備好接受高濃度的回憶連線。</p>' +
    '</div>' +
    '<div style="margin-top:15px;">' +
      '<button class="btn" onclick="level1()">[ 進入系統解密 ]</button>' +
      '<button class="btn pink" onclick="inspectCore()">[ 檢視系統核心 ]</button>' +
    '</div>'
  );
}

function inspectCore() {
  render(
    '<div>' +
      '<div class="kicker">SYSTEM INFRASTRUCTURE</div>' +
      '<h2>核心數據分析</h2>' +
      '<div class="terminal">' +
        '> 玩家（企鵝）：玩拜拜肉 + Talk Shit + 忠誠大狗 100%<br><br>' +
        '> 寄件人（熊熊）：貓系 + 咬咬技能 + 偶爾內耗 100%<br><br>' +
        '> 當前關係狀態：未婚夫妻 (ENGAGED)<br><br>' +
        '> 核心連結：無可替代' +
      '</div>' +
    '</div>' +
    '<div>' +
      '<button class="btn" onclick="start()">[ 返回主選單 ]</button>' +
    '</div>'
  );
}

// --- LEVEL 1 ---
function level1() {
  setStatus("STAGE 01: VOICE CHECK", "var(--line)");
  render(
    '<div>' +
      '<div class="kicker">LEVEL 01 // 語音情境密碼</div>' +
      '<h2>熊熊的招式辨識 🐾</h2>' +
      '<p>當熊熊突然視察附近無人，或者用眼神望住你嘅時候，以下哪一個行為解讀是最準確的？</p>' +
      '<div class="options">' +
        '<button class="btn option" onclick="ans1(false, \'錯誤。熊熊並非要進行商業握手。\')">A. 想跟你進行嚴肅的商務握手</button>' +
        '<button class="btn option" onclick="ans1(true, \'驗證成功！這是完美的熊熊解讀。\')">B. 準備要咬一口 / 討抱抱</button>' +
        '<button class="btn option" onclick="ans1(false, \'系統錯誤。熊熊很少會主動討論微積分。\')">C. 示意你講解高等數學題目</button>' +
        '<button class="btn option" onclick="ans1(false, \'匹配失敗。這個指令不符合熊熊行為學。\')">D. 提醒你該去清理貓砂了</button>' +
      '</div>' +
      '<div id="fb"></div>' +
    '</div>'
  );
}

function ans1(correct, msg) {
  var options = document.querySelectorAll('.option');
  for (var i = 0; i < options.length; i++) { options[i].disabled = true; }
  var fb = document.getElementById('fb');
  if (correct) {
    fb.className = 'feedback good';
    fb.innerHTML = msg + '<br><button class="btn ok" style="margin-top:10px;" onclick="level2()">[ 進入 Level 2 ]</button>';
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = msg + '<br><button class="btn pink" style="margin-top:10px;" onclick="level1()">[ 重試 ]</button>';
  }
}

// --- LEVEL 2 ---
function level2() {
  setStatus("STAGE 02: CHAT LOGS", "var(--pink)");
  render(
    '<div>' +
      '<div class="kicker">LEVEL 02 // 日常對話鏈重構</div>' +
      '<h2>日常對話鏈重構 💬</h2>' +
      '<p>系統擷取到一段兩人的經典日常對話片段，請填入最常出現的關鍵回應：</p>' +
      '<div class="chat-box">' +
        '<div class="chat-msg chat-right">企鵝：「食咩好呢呀？」</div>' +
        '<div class="chat-msg chat-left">熊熊：「（以下何者最符合預設反應？）」</div>' +
      '</div>' +
      '<div class="options">' +
        '<button class="btn option" onclick="ans2(false)">A. 「隨便啦，我食微波爐便當就得。」</button>' +
        '<button class="btn option" onclick="ans2(true)">B. 「打邊爐好無？」</button>' +
        '<button class="btn option" onclick="ans2(false)">C. 「請參考我們 2020.12.23 簽署的排程協定。」</button>' +
      '</div>' +
      '<div id="fb"></div>' +
    '</div>'
  );
}

function ans2(ok) {
  var options = document.querySelectorAll('.option');
  for (var i = 0; i < options.length; i++) { options[i].disabled = true; }
  var fb = document.getElementById('fb');
  if (ok) {
    fb.className = 'feedback good';
    fb.innerHTML = '對話鏈匹配成功！系統確認該回應符合 100% 正牌記憶。<br><button class="btn ok" style="margin-top:10px;" onclick="level3()">[ 進入 Level 3 ]</button>';
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = '數據不符！這不是會發生的對話。<br><button class="btn pink" style="margin-top:10px;" onclick="level2()">[ 重試 ]</button>';
  }
}

// --- LEVEL 3 ---
var fragments = [
  { id: 1, year: "2020", text: "荔景涼亭" },
  { id: 2, year: "2021", text: "如心" },
  { id: 3, year: "2022", text: "海洋公園" },
  { id: 4, year: "2023", text: "屯門公園" },
  { id: 5, year: "2024", text: "台南高雄" },
  { id: 6, year: "2025", text: "牧羊少年" },
  { id: 7, year: "2026", text: "普慶自助大餐" }
];
var displayOrder = [];
var userOrder = [];

function shuffle(array) {
  var arr = array.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}

function level3() {
  setStatus("STAGE 03: TIMELINE", "var(--gold)");
  userOrder = [];
  displayOrder = shuffle(fragments);
  renderTimeline();
}

function renderTimeline() {
  var optionsHtml = '';
  for (var i = 0; i < displayOrder.length; i++) {
    var f = displayOrder[i];
    var isSelected = userOrder.indexOf(f.id) !== -1;
    optionsHtml += '<button class="btn option" ' + (isSelected ? 'disabled' : '') + ' onclick="selectFragment(' + f.id + ')">' +
      (isSelected ? '[已選擇] ' : '+ ') + f.text +
    '</button>';
  }

  var selectedHtml = '';
  for (var j = 0; j < userOrder.length; j++) {
    var item = getFragmentById(userOrder[j]);
    selectedHtml += '<div class="timeline-item"><span>STEP ' + (j + 1) + ' (' + (2020 + j) + '): <b>' + item.text + '</b></span> <span class="remove-btn" onclick="removeFragment(' + j + ')">✕</span></div>';
  }

  render(
    '<div>' +
      '<div class="kicker">LEVEL 03 // 時間軸路線重構</div>' +
      '<h2>2020-2026 生日地點足跡排序 📍</h2>' +
      '<p>請按年份順序（2020 至 2026 年）點擊組裝正確的生日地點：</p>' +
      '<div class="timeline-list">' + (selectedHtml || '<p class="muted">[ 請點擊下方選項依序組裝... ]</p>') + '</div>' +
      '<div class="options">' + optionsHtml + '</div>' +
      '<div class="btn-group">' +
        '<button class="btn pink" onclick="resetTimeline()">[ 清空重來 ]</button>' +
        '<button class="btn ok" onclick="verifyTimeline()">[ 驗證時間軸 ]</button>' +
      '</div>' +
      '<div id="fb"></div>' +
    '</div>'
  );
}

function getFragmentById(id) {
  for (var i = 0; i < fragments.length; i++) {
    if (fragments[i].id === id) return fragments[i];
  }
  return null;
}

function selectFragment(id) {
  if (userOrder.indexOf(id) === -1) {
    userOrder.push(id);
    renderTimeline();
  }
}

function removeFragment(index) {
  userOrder.splice(index, 1);
  renderTimeline();
}

function resetTimeline() {
  userOrder = [];
  displayOrder = shuffle(fragments);
  renderTimeline();
}

function verifyTimeline() {
  var fb = document.getElementById('fb');
  if (userOrder.length < fragments.length) {
    fb.className = 'feedback bad';
    fb.textContent = '請先選擇完整 ' + fragments.length + ' 個生日地點！';
    return;
  }
  
  var isCorrect = true;
  for (var i = 0; i < userOrder.length; i++) {
    if (userOrder[i] !== i + 1) {
      isCorrect = false;
      break;
    }
  }

  if (isCorrect) {
    fb.className = 'feedback good';
    fb.innerHTML = '時間軸校正完美！數據完整無缺。<br><button class="btn ok" style="margin-top:10px;" onclick="level4()">[ 進入 Level 4 ]</button>';
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = '時間軸順序有誤！請重新嘗試。<br><button class="btn pink" style="margin-top:10px;" onclick="resetTimeline()">[ 重置重試 ]</button>';
  }
}

// --- LEVEL 4 ---
function level4() {
  setStatus("STAGE 04: SYNC TEST", "var(--pink)");
  clickCount = 0;
  render(
    '<div>' +
      '<div class="kicker">LEVEL 04 // 雙人同步率測試</div>' +
      '<h2>心律與默契充能 ⚡</h2>' +
      '<p>請連續點擊下方的心臟，將心律同步率提升至 100%！</p>' +
      '<div class="heart-rate">' +
        '<div class="heart-icon">❤️</div>' +
        '<div>' +
          '<div style="font-size:28px; font-weight:bold; color:var(--line); text-shadow:0 0 10px var(--line);" id="syncVal">0%</div>' +
          '<div class="muted">SYSTEM SYNC STATUS</div>' +
        '</div>' +
      '</div>' +
      '<button class="btn pink" onclick="chargeSync()">[ 注入能量 (PULSE) ]</button>' +
      '<div id="fb"></div>' +
    '</div>'
  );
}

function chargeSync() {
  clickCount += 20;
  if (clickCount > 100) clickCount = 100;
  var syncVal = document.getElementById('syncVal');
  if (syncVal) syncVal.textContent = clickCount + '%';
  
  if (clickCount >= 100) {
    var fb = document.getElementById('fb');
    if (fb) {
      fb.className = 'feedback good';
      fb.innerHTML = 'SYNC COMPLETE! 默契同步率達 100%！<br><button class="btn ok" style="margin-top:10px;" onclick="level5()">[ 進入 Level 5 ]</button>';
    }
  }
}

// --- LEVEL 5 ---
function level5() {
  setStatus("STAGE 05: FUTURE ARCHIVE", "var(--line)");
  render(
    '<div>' +
      '<div class="kicker">LEVEL 05 // 未來協定</div>' +
      '<h2>寫入 2026/2027 未來願望 💫</h2>' +
      '<p><b>在接下來的日子裡，你最想跟熊熊一起完成的一件事是什麼？</b></p>' +
      '<input type="text" id="futureWish" class="input" placeholder="例如：去旅行 / 食某間餐廳 / 買嘢... " />' +
      '<button class="btn pink" style="margin-top:14px;" onclick="saveWish()">[ 寫入未來磁區 ]</button>' +
      '<div id="fb"></div>' +
    '</div>'
  );
}

function saveWish() {
  var input = document.getElementById('futureWish');
  var val = input ? input.value.trim() : '';
  var fb = document.getElementById('fb');
  if (!val) {
    if (fb) {
      fb.className = 'feedback bad';
      fb.textContent = '請輸入具體的願望內容！';
    }
    return;
  }
  if (fb) {
    fb.className = 'feedback good';
    fb.innerHTML = '已成功將願望「<b>' + val + '</b>」寫入企鵝與熊熊的共同未來檔案。<br><button class="btn ok" style="margin-top:10px;" onclick="finalPage()">[ 讀取終極生日檔案 ]</button>';
  }
}

        '<p>謝謝你一直以來像金毛大狗狗般溫暖的存在，接住我的情緒及內耗。</p>' +
